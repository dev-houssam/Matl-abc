[project]
name        = "gui_glade"
version     = "1.0.0"
description = "UI definie dans un fichier .glade (XML), chargee par GtkBuilder"
entry       = "main.mabc"

[types]
[dependencies]

[backend]
blas   = false
lapack = false
fft    = false
llvm   = true

[build]
optimize     = true
output       = "/tmp/gui_glade_out"
strict_types = true

[lib.gtk3]
file    = "/usr/lib/x86_64-linux-gnu/libgtk-3.so"
headers = "headers/gtk3.mabh"

[lib.gdk3]
file = "/usr/lib/x86_64-linux-gnu/libgdk-3.so"

[lib.glib]
file = "/usr/lib/x86_64-linux-gnu/libglib-2.0.so"

[lib.gobject]
file = "/usr/lib/x86_64-linux-gnu/libgobject-2.0.so"

[lib.gio]
file = "/usr/lib/x86_64-linux-gnu/libgio-2.0.so"

[lib.pango]
file = "/usr/lib/x86_64-linux-gnu/libpango-1.0.so"

[lib.pangocairo]
file = "/usr/lib/x86_64-linux-gnu/libpangocairo-1.0.so"

[lib.cairo]
file = "/usr/lib/x86_64-linux-gnu/libcairo.so"

[lib.cairogobject]
file = "/usr/lib/x86_64-linux-gnu/libcairo-gobject.so"

[lib.gdkpixbuf]
file = "/usr/lib/x86_64-linux-gnu/libgdk_pixbuf-2.0.so"

[lib.atk]
file = "/usr/lib/x86_64-linux-gnu/libatk-1.0.so"

[lib.harfbuzz]
file = "/usr/lib/x86_64-linux-gnu/libharfbuzz.so"

[lib.gladebuilder]
file    = "/usr/lib/x86_64-linux-gnu/libgtk-3.so"
headers = "headers/glade.mabh"
