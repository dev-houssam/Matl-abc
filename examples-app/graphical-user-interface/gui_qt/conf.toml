[project]
name        = "gui_qt"
version     = "1.0.0"
description = "Test minimal Qt6 via mini-wrapper C + FFI MATL-ABC"
entry       = "main.mabc"

[types]
[dependencies]

[backend]
blas   = false
lapack = false
fft    = false
llvm   = true

[build]
optimize     = true
output       = "/tmp/gui_qt_out"
strict_types = true

[lib.qtwrapper]
file    = "/tmp/matlabc_full/examples/gui_qt/libqtwrapper.so"
headers = "headers/qt.mabh"
