[project]
name = "matlabc_ui2"
version = "2.0.0"
entry = "main.mabc"
[types]
[dependencies]
[foreign]
SDL2          = "lib:SDL2"
OpenGL        = "lib:GL"
OpenGLShaders = "lib:GL"
OpenGLBuffers = "lib:GL"
Libm          = "lib:m"
[backend]
blas=false
lapack=false
fft=false
llvm=true
[build]
optimize=true
output="./ui_demo"
strict_types=true
